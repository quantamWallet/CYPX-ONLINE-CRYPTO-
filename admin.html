/* ===============================
   GLOBAL
================================ */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:
    linear-gradient(rgba(0,8,20,.88),rgba(0,29,61,.92)),
    url("Screenshot_20260701-191309.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
    min-height:100vh;
}


/* ===============================
   LOADER
================================ */

.loader{
    position:fixed;
    inset:0;
    background:#000814;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.spinner{
    width:50px;
    height:50px;
    border:4px solid rgba(255,255,255,.15);
    border-top:4px solid #00e5ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* ===============================
   HEADER
================================ */

.header{
    padding:18px;
    background:linear-gradient(90deg,#001d3d,#003566);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
    box-shadow:0 3px 15px rgba(0,0,0,.3);
}

.header-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
}

.header-title i{
    color:#00e5ff;
}


/* ===============================
   LOGOUT
================================ */

.logout{
    background:#ff3b30;
    border:none;
    color:white;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.logout:hover{
    background:#d92b22;
    transform:translateY(-1px);
}


/* ===============================
   CONTAINER
================================ */

.container{
    padding:15px;
    max-width:900px;
    margin:auto;
}


/* ===============================
   ADMIN EMAIL
================================ */

#adminEmail{
    color:#b9d8ed;
    font-size:14px;
    margin-bottom:15px;
    background:rgba(0,26,51,.75);
    padding:12px 14px;
    border-radius:10px;
    border:1px solid rgba(0,229,255,.12);
}


/* ===============================
   DASHBOARD CARDS
================================ */

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:rgba(0,26,51,.92);
    padding:20px;
    border-radius:16px;
    border:1px solid rgba(0,229,255,.10);
    box-shadow:0 0 20px rgba(0,200,255,.12);
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 0 24px rgba(0,200,255,.20);
}

.card i{
    font-size:25px;
    color:#00e5ff;
    display:block;
    margin-bottom:8px;
}

.card small{
    color:#c8d5df;
    font-size:13px;
}

.card h2{
    margin:8px 0 0;
    color:#ffd700;
    font-size:22px;
}


/* ===============================
   ADMIN MENU
================================ */

.menu{
    margin-top:20px;
}

.menu-title{
    font-size:13px;
    color:#9bb6c9;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:0 0 10px 3px;
}


/* ===============================
   MENU LINKS
================================ */

.menu a{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:16px;
    margin-bottom:10px;
    background:rgba(0,26,51,.94);
    color:white;
    text-decoration:none;
    border-radius:12px;
    border:1px solid rgba(0,229,255,.08);
    position:relative;
    transition:.2s;
}

.menu a:hover{
    background:#002855;
    transform:translateX(2px);
}

.menu a:active{
    transform:scale(.99);
}

.menu a div{
    display:flex;
    align-items:center;
    gap:15px;
}

.menu a i{
    color:#00e5ff;
    width:22px;
    text-align:center;
}


/* ===============================
   BADGES
================================ */

.badge{
    background:linear-gradient(135deg,#ff3b30,#ff9500);
    color:white;
    font-size:11px;
    font-weight:800;
    padding:4px 9px;
    border-radius:20px;
    min-width:22px;
    text-align:center;
    box-shadow:0 0 10px rgba(255,59,48,.5);
    animation:pulse 1.5s infinite;
}

.badge.hide{
    display:none;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.1);
    }

}


/* ===============================
   NOTIFICATION
================================ */

.notification{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.9);
    background:#071a2d;
    color:white;
    padding:16px 22px;
    border-radius:12px;
    border:1px solid rgba(0,229,255,.3);
    box-shadow:0 10px 35px rgba(0,0,0,.5);
    z-index:10000;
    font-size:14px;
    text-align:center;
    max-width:85%;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.notification.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

.notification.error{
    border-color:rgba(255,59,48,.5);
}


/* ===============================
   MOBILE
================================ */

@media(max-width:600px){

    .header{
        padding:15px;
    }

    .header-title{
        font-size:14px;
    }

    .logout{
        padding:9px 12px;
        font-size:12px;
    }

    .container{
        padding:12px;
    }

    .cards{
        gap:10px;
    }

    .card{
        padding:16px;
        border-radius:14px;
    }

    .card i{
        font-size:21px;
    }

    .card h2{
        font-size:19px;
    }

    .menu a{
        padding:15px;
    }

}


/* ===============================
   VERY SMALL SCREENS
================================ */

@media(max-width:360px){

    .cards{
        grid-template-columns:1fr;
    }

}

/* ===============================

================================ */

if(!firebase.apps.length){

const auth = firebase.auth();

const db = firebase.database();


/* ===============================
   NOTIFICATION FUNCTION
================================ */

function showNotification(message, isError = false){

    const notification =
        document.getElementById("notification");

    notification.textContent = message;

    notification.classList.toggle(
        "error",
        isError
    );

    notification.classList.add("show");

    setTimeout(()=>{

        notification.classList.remove("show");

    },3000);

}


/* ===============================
   ADMIN SECURITY CHECK
================================ */

auth.onAuthStateChanged(user => {

    if(!user){

        window.location.href = "auth.html";

        return;

    }


    const uid = user.uid;


    db.ref("admins/" + uid)
    .once("value")
    .then(snapshot => {


        /* ADMIN RECORD DOES NOT EXIST */

        if(!snapshot.exists()){

            showNotification(
                "Access denied. Admin only.",
                true
            );

            setTimeout(()=>{

                auth.signOut();

                window.location.href =
                    "auth.html";

            },1800);

            return;

        }


        const admin = snapshot.val();


        /* CHECK ADMIN STATUS */

        if(
            admin.status !== "active" ||
            admin.role !== "admin"
        ){

            showNotification(
                "Admin account is disabled.",
                true
            );

            setTimeout(()=>{

                auth.signOut();

                window.location.href =
                    "auth.html";

            },1800);

            return;

        }


        /* ADMIN VERIFIED */

        document.getElementById(
            "adminEmail"
        ).textContent =
            "Admin: " + (user.email || "Administrator");


        loadDashboard();


        document.getElementById(
            "loader"
        ).style.display = "none";


    })
    .catch(error => {

        console.error(
            "Admin verification error:",
            error
        );


        showNotification(
            "Admin verification failed.",
            true
        );

    });

});


/* ===============================
   DASHBOARD DATA
================================ */

function loadDashboard(){


    /* ===============================
       TOTAL USERS
    ================================ */

    db.ref("users").on("value", snap => {


        let count = 0;

        let newUsers = 0;


        snap.forEach(user => {

            count++;


            const data = user.val() || {};

            const createdAt =
                Number(data.createdAt || 0);


            /* USERS CREATED WITHIN 24 HOURS */

            if(
                createdAt > 0 &&
                Date.now() - createdAt <
                86400000
            ){

                newUsers++;

            }

        });


        document.getElementById(
            "totalUsers"
        ).textContent = count;


        updateBadge(
            "badgeUsers",
            newUsers
        );

    });


    /* ===============================
       TOTAL DEPOSITS
       + PENDING BADGE
    ================================ */

    db.ref("deposits").on("value", snap => {


        let total = 0;

        let pendingCount = 0;


        snap.forEach(user => {


            user.forEach(deposit => {


                const d =
                    deposit.val() || {};


                total += Number(
                    d.amount ||
                    d.depositAmount ||
                    d.price ||
                    0
                );


                if(
                    String(d.status || "")
                    .toLowerCase() ===
                    "pending"
                ){

                    pendingCount++;

                }

            });

        });


        document.getElementById(
            "totalDeposits"
        ).textContent =
            "$" +
            total.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                }
            );


        updateBadge(
            "badgeDeposits",
            pendingCount
        );

    });


    /* ===============================
       WITHDRAWALS
       + PENDING BADGE
    ================================ */

    db.ref("withdrawals").on("value", snap => {


        let total = 0;

        let pendingWithdrawals = 0;


        snap.forEach(user => {


            user.forEach(request => {


                const w =
                    request.val() || {};


                const status =
                    String(
                        w.status || ""
                    ).toLowerCase();


                /* APPROVED WITHDRAWALS */

                if(status === "approved"){

                    total += Number(
                        w.amount || 0
                    );

                }


                /* PENDING WITHDRAWALS */

                if(status === "pending"){

                    pendingWithdrawals++;

                }

            });

        });


        document.getElementById(
            "totalWithdrawals"
        ).textContent =
            "$" +
            total.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                }
            );


        updateBadge(
            "badgeWithdrawals",
            pendingWithdrawals
        );

    });


    /* ===============================
       SUPPORT
       + UNREAD BADGE
    ================================ */

    db.ref("support_chats").on(
        "value",
        snap => {


            let pending = 0;


            snap.forEach(userChat => {


                userChat.forEach(msg => {


                    const m =
                        msg.val() || {};


                    if(
                        m.sender === "user" &&
                        !m.read
                    ){

                        pending++;

                    }

                });

            });


            document.getElementById(
                "pendingSupport"
            ).textContent = pending;


            updateBadge(
                "badgeSupport",
                pending
            );

        }
    );

}


/* ===============================
   BADGE HELPER
================================ */

function updateBadge(id, count){


    const badge =
        document.getElementById(id);


    if(!badge){

        return;

    }


    count = Number(count || 0);


    if(count > 0){

        badge.textContent =
            count > 99 ? "99+" : count;

        badge.classList.remove("hide");

    }else{

        badge.textContent = "0";

        badge.classList.add("hide");

    }

}


/* ===============================
   LOGOUT
================================ */

function logout(){


    auth.signOut()
    .then(()=>{


        localStorage.clear();

        sessionStorage.clear();


        window.location.href =
            "auth.html";


    })
    .catch(error => {

        console.error(
            "Logout error:",
            error
        );

        showNotification(
            "Unable to logout. Please try again.",
            true
        );

    });

}
