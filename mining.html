<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CYPX Mining</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,'Segoe UI',sans-serif}
body{
 background:#070d17;color:#fff;min-height:100vh;
 background-image:radial-gradient(circle at top,#10233b 0,#070d17 48%);
}
header{
 height:58px;background:rgba(5,18,34,.92);border-bottom:1px solid #17314d;
 display:flex;align-items:center;justify-content:center;
 position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)
}
header h1{font-size:18px;font-weight:800;letter-spacing:.7px;color:#f5c842}
header i{margin-right:7px}

.container{width:100%;max-width:560px;margin:auto;padding:13px}

.balance-card{
 padding:17px 18px;border-radius:15px;margin-bottom:17px;
 background:linear-gradient(135deg,#075b9e,#087b68);
 border:1px solid rgba(255,255,255,.1);
 box-shadow:0 8px 25px rgba(0,0,0,.22)
}
.balance-label{
 font-size:10px;text-transform:uppercase;letter-spacing:1px;
 color:rgba(255,255,255,.7)
}
.balance-value{
 margin-top:4px;font-size:25px;font-weight:850;color:#ffd84a
}

.section-title{
 display:flex;align-items:center;justify-content:space-between;
 margin:17px 2px 9px;font-size:12px;
 color:#aab9ca;text-transform:uppercase;letter-spacing:.8px;font-weight:800
}

.plan-grid{display:grid;gap:9px}

.plan-card{
 background:rgba(12,27,43,.9);border:1px solid #1b344d;
 border-radius:12px;padding:12px;
 transition:.2s
}
.plan-card.owned{border-color:#00b98b}
.plan-card.completed{
 border-color:#33475a;opacity:.82
}

.plan-header{
 display:flex;align-items:center;justify-content:space-between;
 margin-bottom:8px
}
.plan-name{font-size:13px;font-weight:800}
.plan-price{font-size:15px;font-weight:850;color:#ffd84a}

.plan-stats{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:5px;margin:7px 0
}
.plan-stat{
 background:#0a1726;border-radius:7px;padding:6px 3px;
 text-align:center;border:1px solid rgba(255,255,255,.035)
}
.plan-stat small{display:block;font-size:8px;color:#73869a;margin-bottom:2px}
.plan-stat div{font-size:10px;font-weight:700}

.plan-btn{
 width:100%;height:34px;border:0;border-radius:8px;
 background:linear-gradient(90deg,#00c896,#009b73);
 color:#03120e;font-size:11px;font-weight:850;
 cursor:pointer
}
.plan-btn:disabled{
 background:#18232e;color:#687887;cursor:not-allowed;
 border:1px solid #273746
}

.active-mines{margin-top:0}

.mine-item{
 background:rgba(10,24,39,.94);border:1px solid #1a344d;
 padding:11px;border-radius:11px;margin-bottom:8px
}
.mine-top{
 display:flex;justify-content:space-between;align-items:center;
 margin-bottom:7px
}
.mine-name{font-size:12px;font-weight:800}
.mine-return{font-size:12px;color:#00c896;font-weight:850}

.progress-bar{
 height:5px;background:#172d42;border-radius:10px;
 overflow:hidden
}
.progress{
 height:100%;background:linear-gradient(90deg,#00c896,#008cff);
 border-radius:10px
}
.timer{
 margin-top:6px;text-align:center;color:#f5c842;
 font-size:10px;font-weight:750;letter-spacing:.5px
}

.completed-label{
 color:#00c896;font-size:9px;font-weight:800;
 text-transform:uppercase;letter-spacing:.5px
}

.empty{
 padding:22px;text-align:center;color:#596b7c;
 font-size:11px;background:#0b1725;border-radius:10px;
 border:1px solid #172a3c
}

.toast{
 position:fixed;left:50%;top:18px;transform:translateX(-50%);
 background:#102536;border:1px solid #00c896;
 color:#fff;padding:10px 16px;border-radius:9px;
 font-size:11px;font-weight:700;z-index:1000;
 display:none;box-shadow:0 8px 25px rgba(0,0,0,.35)
}

@media(max-width:420px){
 .container{padding:10px}
 .plan-stats{grid-template-columns:repeat(2,1fr)}
 .balance-value{font-size:23px}
}
</style></head><body><header>
<h1><i class="fas fa-microchip"></i>CYPX MINING</h1>
</header><div class="toast" id="toast"></div><div class="container"><div class="balance-card">
<div class="balance-label">Available Balance</div>
<div class="balance-value" id="balance">$0.00</div>
</div><div class="section-title">Mining Plans</div>
<div class="plan-grid" id="plans"></div><div class="section-title">Your Mining</div>
<div class="active-mines" id="activeMines"></div></div><script>
const firebaseConfig={
 apiKey:"AIzaSyCCW4G9JlVu_xb0bGjlKmsi5mdqXSwvFak",
 authDomain:"quantum-rio.firebaseapp.com",
 databaseURL:"https://quantum-rio-default-rtdb.firebaseio.com",
 projectId:"quantum-rio",
 storageBucket:"quantum-rio.firebasestorage.app",
 messagingSenderId:"805433999377",
 appId:"1:805433999377:web:d0efa8c46ec4a0fa30f1b0",
 measurementId:"G-4RSQXZJX44"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const auth=firebase.auth();

let userId=null,balance=0,activeMines={};

const plans=[
{id:1,name:"Bronze Miner",price:25,roi:18,days:36},
{id:2,name:"Silver Miner",price:50,roi:20,days:36},
{id:3,name:"Gold Miner",price:100,roi:22,days:36},
{id:4,name:"Platinum Miner",price:250,roi:25,days:21},
{id:5,name:"Diamond Miner",price:500,roi:28,days:21},
{id:6,name:"Titanium Miner",price:1000,roi:30,days:21},
{id:7,name:"Elite Miner",price:2500,roi:33,days:14},
{id:8,name:"VIP Miner",price:5000,roi:35,days:14},
{id:9,name:"Quantum Miner",price:10000,roi:38,days:14},
{id:10,name:"CYPX Infinity",price:25000,roi:40,days:14}
];

auth.signInAnonymously().catch(console.error);

auth.onAuthStateChanged(user=>{
 if(user){
  userId=user.uid;
  loadData();
  setInterval(checkMines,5000);
  setInterval(renderActive,1000);
 }
});

function loadData(){
 db.ref("users/"+userId).on("value",snap=>{
  const data=snap.val()||{};
  balance=Number(data.balance)||0;
  activeMines=data.activeMining||{};
  document.getElementById("balance").textContent=
   "$"+balance.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  renderPlans();
  renderActive();
  checkMines();
 });
}

function renderPlans(){
 document.getElementById("plans").innerHTML=plans.map(p=>{
  const profit=p.price*p.roi/100;
  const daily=profit/p.days;

  const mines=Object.values(activeMines);
  const active=Object.values(activeMines).find(m=>
   m && m.planName===p.name && m.status==="active"
  );

  const completed=mines.find(m=>
   m && m.planName===p.name && m.status==="completed"
  );

  let text="Activate $"+p.price;
  let disabled=balance<p.price;
  let cls="";

  if(completed){
   text="Maturity Completed";
   disabled=true;
   cls="completed";
  }else if(active){
   const end=Number(active.endTime)||
    Number(active.startedAt)+(Number(active.days)*86400000);
   const days=Math.max(0,Math.ceil((end-Date.now())/86400000));
   text=days>0?`Matures in ${days} days`:"Maturity Processing";
   disabled=true;
   cls="owned";
  }else if(balance<p.price){
   text="Insufficient Balance";
   disabled=true;
  }

  return `
  <div class="plan-card ${cls}">
   <div class="plan-header">
    <div class="plan-name">${p.name}</div>
    <div class="plan-price">$${p.price.toLocaleString()}</div>
   </div>

   <div class="plan-stats">
    <div class="plan-stat"><small>ROI</small><div>${p.roi}%</div></div>
    <div class="plan-stat"><small>Profit</small><div>$${profit.toFixed(2)}</div></div>
    <div class="plan-stat"><small>Duration</small><div>${p.days}D</div></div>
    <div class="plan-stat"><small>Daily</small><div>$${daily.toFixed(2)}</div></div>
   </div>

   <button class="plan-btn"
    onclick="buyPlan(${p.id})"
    ${disabled?"disabled":""}>
    ${text}
   </button>
  </div>`;
 }).join("");
}

function buyPlan(planId){
 if(!userId)return;

 const plan=plans.find(p=>p.id===planId);
 if(!plan||balance<plan.price)
  return showToast("Insufficient Balance");

 const alreadyUsed=Object.values(activeMines).find(m=>
  m && m.planName===plan.name
 );

 if(alreadyUsed)
  return showToast("This mining plan has already been used.");

 const mineId=Date.now();
 const now=Date.now();
 const endTime=now+(plan.days*86400000);
 const profit=plan.price*plan.roi/100;

 db.ref("users/"+userId+"/balance")
 .transaction(c=>(Number(c)||0)-plan.price);

 db.ref(`users/${userId}/activeMining/${mineId}`).set({
  planName:plan.name,
  amount:plan.price,
  profit:profit,
  roi:plan.roi,
  days:plan.days,
  startedAt:now,
  endTime:endTime,
  status:"active"
 });

 showToast(`${plan.name} activated for ${plan.days} days`);
}

function formatTime(ms){
 ms=Number(ms);
 if(isNaN(ms)||ms<=0)return"Processing maturity...";
 const d=Math.floor(ms/86400000);
 const h=Math.floor((ms%86400000)/3600000);
 const m=Math.floor((ms%3600000)/60000);
 const s=Math.floor((ms%60000)/1000);

 if(d>0)return`${d}d ${h}h ${m}m ${s}s`;
 return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function renderActive(){
 const container=document.getElementById("activeMines");

 if(!activeMines||!Object.keys(activeMines).length){
  container.innerHTML='<div class="empty">No mining activity</div>';
  return;
 }

 container.innerHTML=Object.entries(activeMines).map(([id,m])=>{
  if(!m)return"";

  const end=Number(m.endTime)||
   Number(m.startedAt)+(Number(m.days)*86400000);

  const start=Number(m.startedAt)||
   end-(Number(m.days)*86400000);

  if(m.status==="completed"){
   return`
   <div class="mine-item">
    <div class="mine-top">
     <div class="mine-name">${m.planName}</div>
     <div class="completed-label">Completed</div>
    </div>
    <div class="progress-bar">
     <div class="progress" style="width:100%"></div>
    </div>
    <div class="timer" style="color:#00c896">
     <i class="fas fa-check-circle"></i> Maturity completed & credited
    </div>
   </div>`;
  }

  const left=end-Date.now();
  const total=end-start;
  const progress=total>0?
   Math.min(100,Math.max(0,((Date.now()-start)/total)*100)):100;

  return`
  <div class="mine-item">
   <div class="mine-top">
    <div class="mine-name">${m.planName} · ${m.days}D</div>
    <div class="mine-return">+$${Number(m.profit||0).toFixed(2)}</div>
   </div>
   <div class="progress-bar">
    <div class="progress" style="width:${progress}%"></div>
   </div>
   <div class="timer">
    <i class="fas fa-clock"></i> ${formatTime(left)}
   </div>
  </div>`;
 }).join("");
}

function checkMines(){
 if(!userId)return;

 db.ref(`users/${userId}/activeMining`).once("value").then(snap=>{
  const mines=snap.val()||{};

  for(const id in mines){
   const m=mines[id];
   if(!m||m.status!=="active")continue;

   const end=Number(m.endTime)||
    Number(m.startedAt)+(Number(m.days)*86400000);

   if(Date.now()<end)continue;

   const ref=db.ref(`users/${userId}/activeMining/${id}`);

   /* Atomically change active → completed.
      Only the process that successfully changes the
      status performs the credit. */
   ref.transaction(current=>{
    if(!current||current.status!=="active")return;
    return Object.assign({},current,{status:"completed",completedAt:Date.now()});
   },(error,committed,snapshot)=>{

    if(error||!committed||!snapshot.exists())return;

    const completed=snapshot.val();
    const amount=Number(completed.amount)||0;
    const profit=Number(completed.profit)||0;
    const total=amount+profit;

    db.ref("users/"+userId+"/balance")
    .transaction(c=>(Number(c)||0)+total);

    db.ref("users/"+userId+"/miningEarnings")
    .transaction(c=>(Number(c)||0)+profit);

    showToast(
     `${completed.planName} matured! +$${total.toFixed(2)} credited`
    );
   });
  }
 });
}

function showToast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;
 t.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>{
  t.style.display="none";
 },3000);
}

document.addEventListener("contextmenu",e=>e.preventDefault());

document.addEventListener("touchstart",e=>{
 if(e.touches.length>1)e.preventDefault();
},{passive:false});

document.addEventListener("touchend",e=>{
 if(e.touches.length>1)e.preventDefault();
},{passive:false});
</script></body>
</html>
