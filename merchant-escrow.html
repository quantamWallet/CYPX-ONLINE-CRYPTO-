<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Merchant Escrow - CYPX Merchant</title>

<meta name="theme-color" content="#007a54">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#08172d;
color:#fff;
padding-bottom:80px;
}

header{
background:linear-gradient(135deg,#007a54,#003b74);
padding:22px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,.35);
}

header h2{
font-size:24px;
font-weight:700;
}

header p{
margin-top:6px;
font-size:14px;
opacity:.9;
}

.container{
width:95%;
max-width:950px;
margin:25px auto;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:22px;
}

.stat-card{
background:#102b4d;
border-radius:18px;
padding:20px;
text-align:center;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.stat-card i{
font-size:30px;
color:#00d4ff;
margin-bottom:10px;
}

.stat-card h2{
font-size:26px;
margin-bottom:5px;
}

.stat-card p{
font-size:14px;
color:#bfcfe2;
}

.card{
background:#102b4d;
border-radius:18px;
padding:20px;
margin-bottom:18px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.loading{
text-align:center;
padding:60px 20px;
color:#bfcfe2;
font-size:15px;
}

.empty{
text-align:center;
padding:70px 20px;
color:#bfcfe2;
}

.toast{
position:fixed;
top:20px;
right:20px;
background:#00c853;
padding:15px 18px;
border-radius:12px;
display:none;
font-weight:600;
z-index:9999;
box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.toast.error{
background:#e53935;
}

.action-btn{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
color:#fff;
transition:.25s;
}

.release-btn{
background:#00c853;
}

.cancel-btn{
background:#e53935;
}

@media(max-width:700px){

.stats{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header>

<h2>

<i class="fas fa-lock"></i>

Merchant Escrow

</h2>

<p>

Securely manage active escrow transactions.

</p>

</header>

<div class="container">

<div class="stats">

<div class="stat-card">

<i class="fas fa-lock"></i>

<h2 id="activeEscrows">0</h2>

<p>Active Escrows</p>

</div>

<div class="stat-card">

<i class="fas fa-coins"></i>

<h2 id="escrowVolume">$0</h2>

<p>Total Escrow Volume</p>

</div>

<div class="stat-card">

<i class="fas fa-check-circle"></i>

<h2 id="releasedEscrows">0</h2>

<p>Released</p>

</div>

</div>

<div id="escrowContainer">

<div class="loading">

<i class="fas fa-spinner fa-spin"></i>

<br><br>

Loading escrow transactions...

</div>

</div>

</div>

<div id="toast" class="toast"></div>

<script>
// ==========================
// FIREBASE CONFIGURATION
// ==========================

const firebaseConfig = {
apiKey:"AIzaSyCCW4G9JlVu_xb0bGjlKmsi5mdqXSwvFak",
authDomain:"quantum-rio.firebaseapp.com",
databaseURL:"https://quantum-rio-default-rtdb.firebaseio.com",
projectId:"quantum-rio",
storageBucket:"quantum-rio.firebasestorage.app",
messagingSenderId:"805433999377",
appId:"1:805433999377:web:d0efa8c46ec4a0fa30f1b0",
measurementId:"G-4RSQXZJX44"
};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const auth=firebase.auth();
const db=firebase.database();

let currentUser=null;
let merchant=null;
let escrowList=[];

// ==========================
// TOAST
// ==========================

function showToast(message,type="success"){

const toast=document.getElementById("toast");

toast.innerHTML=message;

toast.className="toast";

if(type==="error"){
toast.classList.add("error");
}

toast.style.display="block";

setTimeout(()=>{
toast.style.display="none";
},3000);

}

// ==========================
// AUTHENTICATION
// ==========================

auth.onAuthStateChanged(async(user)=>{

if(!user){

location.href="auth.html";
return;

}

currentUser=user;

try{

const merchantSnap=await db.ref("merchantApplications/"+user.uid).once("value");

if(!merchantSnap.exists()){

location.href="merchant-apply.html";
return;

}

merchant=merchantSnap.val();

if(merchant.status!=="approved"){

location.href="merchant-apply.html";
return;

}

loadEscrowTransactions();

}catch(err){

console.error(err);

showToast(err.message,"error");

}

});

// ==========================
// LOAD ESCROW TRANSACTIONS
// ==========================

function loadEscrowTransactions(){

db.ref("escrowTransactions")
.orderByChild("merchantUid")
.equalTo(currentUser.uid)
.on("value",(snapshot)=>{

escrowList=[];

let active=0;
let released=0;
let volume=0;

snapshot.forEach(child=>{

const escrow={
id:child.key,
...child.val()
};

escrowList.unshift(escrow);

volume+=Number(escrow.amount||0);

if(escrow.status==="active"){
active++;
}

if(escrow.status==="released"){
released++;
}

});

document.getElementById("activeEscrows").textContent=active;
document.getElementById("releasedEscrows").textContent=released;
document.getElementById("escrowVolume").textContent=
"$"+volume.toLocaleString();

renderEscrows();

});

}
// ==========================
// RENDER ESCROW TRANSACTIONS
// ==========================

function renderEscrows(){

const container=document.getElementById("escrowContainer");

container.innerHTML="";

if(escrowList.length===0){

container.innerHTML=`

<div class="empty">

<i class="fas fa-vault"
style="font-size:65px;color:#00d4ff;"></i>

<br><br>

<h3>No Escrow Transactions</h3>

<p>Your escrow transactions will appear here.</p>

</div>

`;

return;

}

escrowList.forEach(item=>{

const card=document.createElement("div");

card.className="card";

const created=item.createdAt||Date.now();

const expiry=(created+30*60*1000)-Date.now();

let timer="Expired";

if(expiry>0){

const mins=Math.floor(expiry/60000);

const secs=Math.floor((expiry%60000)/1000);

timer=mins+"m "+secs+"s";

}

let color="#00c853";

if(item.status==="active") color="#ff9800";
if(item.status==="released") color="#00c853";
if(item.status==="cancelled") color="#e53935";
if(item.status==="disputed") color="#f44336";

card.innerHTML=`

<div style="display:flex;justify-content:space-between;align-items:center;">

<div>

<h3>Escrow #${item.id.slice(0,8)}</h3>

<div style="font-size:13px;color:#bfcfe2;">
${(item.type||"BUY").toUpperCase()} USDT
</div>

</div>

<div style="
background:${color};
padding:6px 14px;
border-radius:20px;
font-size:13px;
font-weight:600;
">

${String(item.status||"active").toUpperCase()}

</div>

</div>

<hr style="margin:18px 0;border:none;border-top:1px solid rgba(255,255,255,.08);">

<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:15px;">

<div>
<b>Customer</b><br>
${item.customerName||"Unknown"}
</div>

<div>
<b>Amount</b><br>
$${Number(item.amount||0).toLocaleString()}
</div>

<div>
<b>Rate</b><br>
KES ${Number(item.rate||0).toFixed(2)}
</div>

<div>
<b>Total</b><br>
KES ${Number(item.totalKES||0).toLocaleString()}
</div>

<div>
<b>Payment</b><br>
${item.paymentMethod||"-"}
</div>

<div>
<b>Time Left</b><br>

<span style="color:#ffd54f;">

${timer}

</span>

</div>

</div>

<div id="escrowActions-${item.id}" style="margin-top:20px;"></div>

`;

container.appendChild(card);

renderEscrowButtons(item);

});

}

// ==========================
// RELEASE ESCROW
// ==========================

async function releaseEscrow(id){

if(!confirm("Release this escrow to the buyer?")) return;

try{

const snap=await db.ref("escrowTransactions/"+id).once("value");

if(!snap.exists()){

showToast("Escrow not found.","error");
return;

}

const escrow=snap.val();

await db.ref("escrowTransactions/"+id).update({
    status:"cancelled",
    cancelledAt:Date.now(),
    cancelledBy:currentUser.uid
});

releasedBy:currentUser.uid

});

await escrowNotification(id,"released");

showToast("Escrow released successfully.");
}catch(err){

console.error(err);

showToast(err.message,"error");

}

}


// ==========================
// ESCROW ACTION BUTTONS
// ==========================

function renderEscrowButtons(item){

const box=document.getElementById("escrowActions-"+item.id);

if(!box) return;

box.innerHTML="";

if(item.status==="active"){

box.innerHTML=`

<button
class="action-btn release-btn"
onclick="releaseEscrow('${item.id}')">

<i class="fas fa-lock-open"></i>
Release Escrow

</button>

<button
class="action-btn cancel-btn"
onclick="cancelEscrow('${item.id}')">

<i class="fas fa-times-circle"></i>
Cancel Escrow

</button>

`;

}

else if(item.status==="released"){

box.innerHTML=`

<div style="
padding:14px;
background:#0d2345;
border-radius:12px;
text-align:center;
color:#00e676;
font-weight:600;
">

<i class="fas fa-check-circle"></i>

Escrow Released Successfully

</div>

`;

}

else if(item.status==="cancelled"){

box.innerHTML=`

<div style="
padding:14px;
background:#0d2345;
border-radius:12px;
text-align:center;
color:#ff5252;
font-weight:600;
">

<i class="fas fa-times-circle"></i>

Escrow Cancelled

</div>

`;

}

else if(item.status==="disputed"){

box.innerHTML=`

<div style="
padding:14px;
background:#0d2345;
border-radius:12px;
text-align:center;
color:#ffb300;
font-weight:600;
">

<i class="fas fa-exclamation-triangle"></i>

Escrow Under Dispute

</div>

`;

}

else{

box.innerHTML=`

<div style="
padding:14px;
background:#0d2345;
border-radius:12px;
text-align:center;
color:#bfcfe2;
">

No actions available.

</div>

`;

}

}
// ==========================
// CANCEL ESCROW
// ==========================

async function cancelEscrow(id){
  if(!confirm("Cancel this escrow transaction?")) return;

try{

await db.ref("escrowTransactions/"+id).update({

status:"cancelled",

cancelledAt:Date.now()

});

await escrowNotification(id,"cancelled");

showToast("Escrow cancelled.");

}catch(err){

console.error(err);

showToast(err.message,"error");

}

}

// ==========================
// ESCROW NOTIFICATIONS
// ==========================

async function escrowNotification(id,status){

const snap=await db.ref("escrowTransactions/"+id).once("value");

if(!snap.exists()) return;

const escrow=snap.val();

// Customer Notification

const notifyId=db.ref().push().key;

await db.ref("notifications/"+escrow.customerUid+"/"+notifyId).set({

title:"Escrow Updated",

message:"Your escrow transaction is now "+status.toUpperCase()+".",

read:false,

time:new Date().toLocaleString(),

timestamp:Date.now()

});

// Merchant Activity

const activityId=db.ref().push().key;

await db.ref("merchantActivity/"+currentUser.uid+"/"+activityId).set({

type:"escrow",

title:"Escrow "+status.toUpperCase(),

message:"Escrow #"+id.substring(0,8)+" was "+status+".",

time:new Date().toLocaleString(),

timestamp:Date.now()

});

// Update Merchant Statistics

if(status==="released"){

const statsRef=db.ref("merchantStats/"+currentUser.uid);

const statsSnap=await statsRef.once("value");

const stats=statsSnap.val()||{};

await statsRef.update({

releasedEscrows:(stats.releasedEscrows||0)+1,

totalEscrowVolume:(stats.totalEscrowVolume||0)+Number(escrow.amount||0),

lastUpdated:Date.now()

});

}

}
</script>

</body>

  </html>
