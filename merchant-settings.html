<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merchant Settings - CYPX Merchant</title>

<meta name="theme-color" content="#007a54">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#08172d;
color:#fff;
padding-bottom:80px;
}

.header{
background:linear-gradient(135deg,#007a54,#003b74);
padding:22px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.header h2{
font-size:25px;
margin-bottom:6px;
}

.header p{
font-size:14px;
opacity:.9;
}

.container{
width:95%;
max-width:900px;
margin:20px auto;
}

.card{
background:#102b4d;
border-radius:18px;
padding:20px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.card h3{
margin-bottom:18px;
font-size:20px;
}

.input-group{
margin-bottom:16px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-size:14px;
color:#bfcfe2;
}

.input-group input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#0b1d35;
color:#fff;
outline:none;
font-size:15px;
}

.save-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#00bcd4;
color:#fff;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

.save-btn:hover{
background:#0097a7;
}

.toast{
position:fixed;
top:20px;
right:20px;
background:#00c853;
padding:15px 20px;
border-radius:12px;
display:none;
font-weight:600;
z-index:99999;
}

.toast.error{
background:#e53935;
}

</style>

</head>

<body>

<header class="header">

<h2>
<i class="fas fa-cog"></i>
Merchant Settings
</h2>

<p>Manage your merchant account.</p>

</header>

<div class="container">

<div class="card">

<h3><i class="fas fa-user"></i> Merchant Profile</h3>

<div class="input-group">
<label>Business Name</label>
<input type="text" id="businessName">
</div>

<div class="input-group">
<label>Merchant Name</label>
<input type="text" id="merchantName">
</div>

<div class="input-group">
<label>Email</label>
<input type="email" id="email" readonly>
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="text" id="phone">
</div>

<button class="save-btn" id="saveProfileBtn">
<i class="fas fa-save"></i>
Save Profile
</button>

</div>
<!-- ==========================
PAYMENT SETTINGS
========================== -->

<div class="card">

<h3><i class="fas fa-wallet"></i> Payment Settings</h3>

<div class="input-group">
<label>M-Pesa Number</label>
<input type="text" id="mpesaNumber" placeholder="07XXXXXXXX">
</div>

<div class="input-group">
<label>Bank Account (Optional)</label>
<input type="text" id="bankAccount" placeholder="Bank account number">
</div>

<div class="input-group">
<label>USDT Wallet Address</label>
<input type="text" id="usdtWallet" placeholder="TRC20 / BEP20 Wallet">
</div>

<button class="save-btn" id="savePaymentBtn">
<i class="fas fa-save"></i>
Save Payment Details
</button>

</div>


<div id="toast" class="toast"></div>

<script>

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCCW4G9JlVu_xb0bGjlKmsi5mdqXSwvFak",
  authDomain: "quantum-rio.firebaseapp.com",
  databaseURL: "https://quantum-rio-default-rtdb.firebaseio.com",
  projectId: "quantum-rio",
  storageBucket: "quantum-rio.firebasestorage.app",
  messagingSenderId: "805433999377",
  appId: "1:805433999377:web:d0efa8c46ec4a0fa30f1b0",
  measurementId: "G-4RSQXZJX44"
};

if(!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}

const auth=firebase.auth();
const db=firebase.database();

let currentUser=null;

function showToast(message,type="success"){

const toast=document.getElementById("toast");

toast.textContent=message;
toast.className="toast";

if(type==="error"){
toast.classList.add("error");
}

toast.style.display="block";

setTimeout(()=>{
toast.style.display="none";
},3000);

}

function loadSettings(){

db.ref("merchantSettings/"+currentUser.uid).once("value")
.then(snapshot=>{

const data=snapshot.val()||{};

document.getElementById("businessName").value=data.businessName||"";
document.getElementById("merchantName").value=data.merchantName||"";
document.getElementById("phone").value=data.phone||"";
document.getElementById("email").value=currentUser.email||"";

document.getElementById("mpesaNumber").value=data.mpesaNumber||"";
document.getElementById("bankAccount").value=data.bankAccount||"";
document.getElementById("usdtWallet").value=data.usdtWallet||"";

});

}

document.getElementById("saveProfileBtn").onclick=()=>{

db.ref("merchantSettings/"+currentUser.uid).update({

businessName:document.getElementById("businessName").value.trim(),
merchantName:document.getElementById("merchantName").value.trim(),
phone:document.getElementById("phone").value.trim()

}).then(()=>{

showToast("Profile updated successfully.");

}).catch(()=>{

showToast("Failed to save profile.","error");

});

};

document.getElementById("savePaymentBtn").onclick=()=>{

db.ref("merchantSettings/"+currentUser.uid).update({

mpesaNumber:document.getElementById("mpesaNumber").value.trim(),
bankAccount:document.getElementById("bankAccount").value.trim(),
usdtWallet:document.getElementById("usdtWallet").value.trim()

}).then(()=>{

showToast("Payment details updated.");

}).catch(()=>{

showToast("Failed to save payment details.","error");

});

};

auth.onAuthStateChanged(user=>{

if(!user){
location.href="auth.html";
return;
}

currentUser=user;
loadSettings();

});

</script>
</body>
  </html>
