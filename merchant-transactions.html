<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merchant Transactions - CYPX Merchant</title>

<meta name="theme-color" content="#007a54">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#08172d;
    color:#fff;
    padding-bottom:80px;
}

.header{
    background:linear-gradient(135deg,#007a54,#003b74);
    padding:22px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.header h2{
    font-size:25px;
    margin-bottom:6px;
}

.header p{
    opacity:.9;
    font-size:14px;
}

.container{
    width:95%;
    max-width:1100px;
    margin:20px auto;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:#102b4d;
    border-radius:18px;
    padding:18px;
    text-align:center;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.stat-card i{
    font-size:28px;
    color:#00d4ff;
    margin-bottom:10px;
}

.stat-card h2{
    font-size:26px;
    margin-bottom:6px;
}

.stat-card p{
    color:#bfcfe2;
    font-size:14px;
}

.card{
    background:#102b4d;
    border-radius:18px;
    padding:18px;
    margin-bottom:20px;
    border:1px solid rgba(255,255,255,.08);
}

#searchInput{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    outline:none;
    margin-bottom:15px;
    background:#0b1d35;
    color:#fff;
    font-size:15px;
}

.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.filters select{
    padding:13px;
    border:none;
    border-radius:12px;
    background:#0b1d35;
    color:#fff;
    outline:none;
}

.loading,.empty{
    text-align:center;
    padding:70px 20px;
    color:#bfcfe2;
}

.transaction-card{
    background:#102b4d;
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.transaction-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.transaction-id{
    font-weight:700;
    font-size:16px;
}

.status{
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.status.completed,
.status.released{
    background:#00c853;
}

.status.pending,
.status.active{
    background:#ff9800;
}

.status.cancelled{
    background:#e53935;
}

.transaction-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    margin-top:10px;
}

.transaction-grid div{
    font-size:14px;
    color:#d7e3ef;
}

.view-btn{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#00bcd4;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:9999;
    align-items:center;
    justify-content:center;
}

.modal-content{
    width:92%;
    max-width:650px;
    background:#102b4d;
    border-radius:18px;
    padding:22px;
    position:relative;
    max-height:90vh;
    overflow:auto;
}

#closeModal{
    position:absolute;
    right:18px;
    top:15px;
    font-size:28px;
    cursor:pointer;
}

.toast{
    position:fixed;
    top:20px;
    right:20px;
    background:#00c853;
    color:#fff;
    padding:15px 20px;
    border-radius:12px;
    display:none;
    z-index:99999;
    font-weight:600;
}

.toast.error{
    background:#e53935;
}

@media(max-width:768px){

.transaction-grid{
    grid-template-columns:1fr;
}

.filters{
    grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header class="header">
    <h2>
        <i class="fas fa-receipt"></i>
        Merchant Transactions
    </h2>
    <p>View and manage all merchant transactions.</p>
</header>

<div class="container">

    <!-- Statistics -->
    <div class="stats">

        <div class="stat-card">
            <i class="fas fa-list"></i>
            <h2 id="totalTransactions">0</h2>
            <p>Total Transactions</p>
        </div>

        <div class="stat-card">
            <i class="fas fa-check-circle"></i>
            <h2 id="completedTransactions">0</h2>
            <p>Completed</p>
        </div>

        <div class="stat-card">
            <i class="fas fa-clock"></i>
            <h2 id="pendingTransactions">0</h2>
            <p>Pending</p>
        </div>

        <div class="stat-card">
            <i class="fas fa-times-circle"></i>
            <h2 id="cancelledTransactions">0</h2>
            <p>Cancelled</p>
        </div>

    </div>

    <!-- Search -->
    <div class="card">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by Transaction ID or Customer">

        <div class="filters">

            <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
                <option value="cancelled">Cancelled</option>
                <option value="active">Active</option>
                <option value="released">Released</option>
            </select>

            <select id="typeFilter">
                <option value="all">All Types</option>
                <option value="buy">Buy</option>
                <option value="sell">Sell</option>
                <option value="escrow">Escrow</option>
            </select>

        </div>

    </div>

    <!-- Transactions -->
    <div id="transactionsContainer">

        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <br><br>
            Loading transactions...
        </div>

    </div>

</div>

<!-- Transaction Details Modal -->

<div id="transactionModal" class="modal">

    <div class="modal-content">

        <span id="closeModal">&times;</span>

        <h3>
            <i class="fas fa-file-invoice"></i>
            Transaction Details
        </h3>

        <div id="transactionDetails"></div>

    </div>

</div>

<!-- Toast -->

<div id="toast" class="toast"></div>

<script>
// ==========================
// FIREBASE CONFIGURATION
// ==========================
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCCW4G9JlVu_xb0bGjlKmsi5mdqXSwvFak",
  authDomain: "quantum-rio.firebaseapp.com",
  databaseURL: "https://quantum-rio-default-rtdb.firebaseio.com",
  projectId: "quantum-rio",
  storageBucket: "quantum-rio.firebasestorage.app",
  messagingSenderId: "805433999377",
  appId: "1:805433999377:web:d0efa8c46ec4a0fa30f1b0",
  measurementId: "G-4RSQXZJX44"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let transactions = [];

// ==========================
// TOAST
// ==========================
function showToast(message, type = "success") {
  const toast = document.getElementById("toast");
  toast.innerHTML = message;
  toast.className = "toast";

  if (type === "error") {
    toast.classList.add("error");
  }

  toast.style.display = "block";

  setTimeout(() => {
    toast.style.display = "none";
  }, 3000);
}

// ==========================
// AUTH
// ==========================
auth.onAuthStateChanged(async (user) => {

  if (!user) {
    location.href = "auth.html";
    return;
  }

  currentUser = user;
  sortTransactions();
renderTransactions();;

});

// ==========================
// LOAD TRANSACTIONS
// ==========================
function loadTransactions() {

  db.ref("escrowTransactions")
    .orderByChild("merchantUid")
    .equalTo(currentUser.uid)
    .on("value", snapshot => {

      transactions = [];

      let completed = 0;
      let pending = 0;
      let cancelled = 0;

      snapshot.forEach(child => {

        const tx = {
          id: child.key,
          ...child.val()
        };

        transactions.unshift(tx);

        if (tx.status === "completed" || tx.status === "released") {
          completed++;
        } else if (tx.status === "pending" || tx.status === "active") {
          pending++;
        } else if (tx.status === "cancelled") {
          cancelled++;
        }

      });

      document.getElementById("totalTransactions").textContent = transactions.length;
      document.getElementById("completedTransactions").textContent = completed;
      document.getElementById("pendingTransactions").textContent = pending;
      document.getElementById("cancelledTransactions").textContent = cancelled;

      refreshTransactions();

    });

}
// ==========================
// RENDER TRANSACTIONS
// ==========================
function renderTransactions(){

const container = document.getElementById("transactionsContainer");

container.innerHTML = "";

if(transactions.length === 0){

container.innerHTML = `
<div class="empty">

<i class="fas fa-receipt"
style="font-size:70px;color:#00d4ff;"></i>

<br><br>

<h3>No Transactions Found</h3>

<p>Your merchant transactions will appear here.</p>

</div>
`;

return;

}

transactions.forEach(tx=>{

let statusClass = (tx.status || "pending").toLowerCase();

const card = document.createElement("div");

card.className = "transaction-card";

card.innerHTML = `

<div class="transaction-header">

<div class="transaction-id">
#${tx.id.substring(0,8)}
</div>

<div class="status ${statusClass}">
${(tx.status || "Pending").toUpperCase()}
</div>

</div>

<div class="transaction-grid">

<div>
<b>Customer</b><br>
${tx.customerName || "Unknown"}
</div>

<div>
<b>Type</b><br>
${(tx.type || "Buy").toUpperCase()}
</div>

<div>
<b>Amount</b><br>
$${Number(tx.amount || 0).toLocaleString()}
</div>

<div>
<b>Rate</b><br>
KES ${Number(tx.rate || 0).toFixed(2)}
</div>

<div>
<b>Total</b><br>
KES ${Number(tx.totalKES || 0).toLocaleString()}
</div>

<div>
<b>Date</b><br>
${tx.time || new Date(tx.createdAt || Date.now()).toLocaleString()}
</div>

</div>

<button
class="view-btn"
onclick="viewTransaction('${tx.id}')">

<i class="fas fa-eye"></i>

View Details

</button>

`;

container.appendChild(card);

});

}
// ==========================
// VIEW TRANSACTION
// ==========================
function viewTransaction(id){

const tx = transactions.find(t => t.id === id);

if(!tx){
showToast("Transaction not found.","error");
return;
}

document.getElementById("transactionDetails").innerHTML = `

<div class="transaction-grid">

<div>
<b>Transaction ID</b><br>
${tx.id}
</div>

<div>
<b>Status</b><br>
${(tx.status || "Pending").toUpperCase()}
</div>

<div>
<b>Customer</b><br>
${tx.customerName || "Unknown"}
</div>

<div>
<b>Customer Email</b><br>
${tx.customerEmail || "-"}
</div>

<div>
<b>Type</b><br>
${(tx.type || "Buy").toUpperCase()}
</div>

<div>
<b>Payment Method</b><br>
${tx.paymentMethod || "-"}
</div>

<div>
<b>Amount</b><br>
$${Number(tx.amount || 0).toLocaleString()}
</div>

<div>
<b>Rate</b><br>
KES ${Number(tx.rate || 0).toFixed(2)}
</div>

<div>
<b>Total</b><br>
KES ${Number(tx.totalKES || 0).toLocaleString()}
</div>

<div>
<b>Date</b><br>
${tx.time || new Date(tx.createdAt || Date.now()).toLocaleString()}
</div>

</div>

`;

document.getElementById("transactionModal").style.display = "flex";

}


// ==========================
// SEARCH & FILTER
// ==========================

document.getElementById("searchInput").addEventListener("input", applyFilters);

document.getElementById("statusFilter").addEventListener("change", applyFilters);

document.getElementById("typeFilter").addEventListener("change", applyFilters);

function applyFilters(){

const search = document.getElementById("searchInput").value.toLowerCase().trim();

const status = document.getElementById("statusFilter").value;

const type = document.getElementById("typeFilter").value;

const container = document.getElementById("transactionsContainer");

container.innerHTML = "";

const filtered = transactions.filter(tx => {

const matchesSearch =
(tx.id || "").toLowerCase().includes(search) ||
(tx.customerName || "").toLowerCase().includes(search);

const matchesStatus =
status === "all" || (tx.status || "").toLowerCase() === status;

const matchesType =
type === "all" || (tx.type || "").toLowerCase() === type;

return matchesSearch && matchesStatus && matchesType;

});

if(filtered.length === 0){

container.innerHTML = `
<div class="empty">

<i class="fas fa-search"
style="font-size:65px;color:#00d4ff;"></i>

<br><br>

<h3>No Matching Transactions</h3>

<p>Try changing your search or filters.</p>

</div>
`;

return;

}

filtered.forEach(tx=>{

let statusClass = (tx.status || "pending").toLowerCase();

const card = document.createElement("div");

card.className = "transaction-card";

card.innerHTML = `

<div class="transaction-header">

<div class="transaction-id">
#${tx.id.substring(0,8)}
</div>

<div class="status ${statusClass}">
${(tx.status || "Pending").toUpperCase()}
</div>

</div>

<div class="transaction-grid">

<div><b>Customer</b><br>${tx.customerName || "Unknown"}</div>

<div><b>Type</b><br>${(tx.type || "BUY").toUpperCase()}</div>

<div><b>Amount</b><br>$${Number(tx.amount || 0).toLocaleString()}</div>

<div><b>Date</b><br>${tx.time || new Date(tx.createdAt || Date.now()).toLocaleString()}</div>

</div>

<button class="view-btn" onclick="viewTransaction('${tx.id}')">

<i class="fas fa-eye"></i>

View Details

</button>

`;

container.appendChild(card);

});

}
// ==========================
// PART 8 - SORT & REFRESH
// ==========================

function sortTransactions(){

transactions.sort((a,b)=>{

const timeA = Number(a.createdAt || a.timestamp || 0);

const timeB = Number(b.createdAt || b.timestamp || 0);

return timeB - timeA;

});

}

// Refresh transaction list
function refreshTransactions(){

sortTransactions();

applyFilters();

}
// ==========================
// PART 9 - MODAL CONTROLS
// ==========================

// Close with X button
document.getElementById("closeModal").addEventListener("click", () => {
    document.getElementById("transactionModal").style.display = "none";
});

// Close by clicking outside the modal
window.addEventListener("click", (e) => {

    const modal = document.getElementById("transactionModal");

    if (e.target === modal) {
        modal.style.display = "none";
    }

});

// Close with ESC key
document.addEventListener("keydown", (e) => {

    if (e.key === "Escape") {
        document.getElementById("transactionModal").style.display = "none";
    }

});

</script>

</body>
  </html>
